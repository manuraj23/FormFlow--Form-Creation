<div class="p-4">
    @for (row of form.rows(); track row.id) {
    <div 
    cdkDropList 
    [cdkDropListData]="row.id"
    (cdkDropListDropped)="onDropInRow($event, row.id)"
    [cdkDropListOrientation]="'mixed'"
        class="relative p-5 pt-2 ps-10 mb-4 bg-white rounded-lg border-2 border-dashed border-gray-200">
        <div class="flex justify-between items-center">
            <span>Row</span>
            <button mat-icon-button (click)="form.deleteRow(row.id)">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <div class="flex gap-4 flex-wrap">
            @for( field of row.fields;track field.id){
                <app-form-field cdkDrag [cdkDragData]="field" class="flex-1" [field]="field"></app-form-field>
        } @empty {
            <div class="w-full p-4 border border-dashed bordedr-primary-container rounded flex items-center justify-center text-gray-400">
                Drag and Drop form elements here
            </div>
        }
        <div class="absolute left-0 flex gap-0 flex-col top-1/2 -translate-y-1/2" >
            <button mat-icon-button [disabled]="$first" (click)="form.moveRowUp(row.id)">
                <mat-icon>keyboard_arrow_up</mat-icon>
            </button>
            <button mat-icon-button [disabled]="$last" (click)="form.moveRowDown(row.id)">
                <mat-icon>keyboard_arrow_down</mat-icon>
            </button>
        </div>
        </div>
        
    </div>
    }

</div>
